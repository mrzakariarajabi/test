name: Download and Upload to Google Drive

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    
    steps:
    - name: Download file
      run: |
        curl -L -o dataset.zip "https://springernature.figshare.com/ndownloader/files/53623187"
        ls -lh dataset.zip
    
    - name: Install rclone
      run: |
        curl https://rclone.org/install.sh | sudo bash
    
    - name: Configure rclone
      env:
        RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
    
    - name: Upload to Google Drive
      run: |
        rclone copy dataset.zip "gdrive:/" --verbose
        # Or to a specific folder: rclone copy dataset.zip "gdrive:MyFolder/"
